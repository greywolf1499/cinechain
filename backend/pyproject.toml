[project]
name = "cinechain"
version = "0.1.0"
description = "Self-hosted movie challenge companion and exploration tool"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlmodel>=0.0.22,<0.1",
    "alembic>=1.13,<2.0",
    "pydantic-settings>=2.4,<3.0",
    "httpx>=0.27,<1.0",
    "bcrypt>=4.2,<5.0",
    "orjson>=3.10,<4.0",
    "anyio>=4.4,<5.0",
    "curl_cffi>=0.7,<1.0",
    "beautifulsoup4>=4.12,<5.0",
    "defusedxml>=0.7,<1.0",
    "pyjwt>=2.9,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "pillow>=10.4,<12.0",
    "onnxruntime>=1.18,<2.0",
    "tokenizers>=0.20,<1.0",
    "numpy>=1.26,<3.0",
]

[project.optional-dependencies]
# Opt-in local GGUF inference for the generative features (needs a C++ toolchain to build).
llm = ["llama-cpp-python>=0.3"]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "respx>=0.21,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint.per-file-ignores]
# Reuses pytest fixtures imported from sibling test modules.
"tests/test_standalone_modes.py" = ["F401", "F811"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query()/etc. are meant to be called in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Path"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
