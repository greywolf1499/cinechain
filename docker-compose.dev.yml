# Hot-reload dev stack: uvicorn --reload (backend) + vite dev server (frontend).
# Frontend proxies /api to the backend service (see frontend/vite.config.ts).
services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev-backend
    container_name: cinechain-backend-dev
    ports:
      - "8787:8787"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      JELLYFIN_URL: ${JELLYFIN_URL:-}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      RADARR_URL: ${RADARR_URL:-}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
      SEERR_URL: ${SEERR_URL:-}
      SEERR_API_KEY: ${SEERR_API_KEY:-}
    volumes:
      - ./backend:/app
      - ./config:/config
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8787 --reload"

  frontend:
    image: node:22-slim
    container_name: cinechain-frontend-dev
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host"
