services:
  cinechain:
    build:
      context: .
      dockerfile: Dockerfile
    image: cinechain:latest
    container_name: cinechain
    restart: unless-stopped
    ports:
      - "${CINECHAIN_PORT:-8787}:8787"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      JELLYFIN_URL: ${JELLYFIN_URL:-}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      RADARR_URL: ${RADARR_URL:-}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
      SEERR_URL: ${SEERR_URL:-}
      SEERR_API_KEY: ${SEERR_API_KEY:-}
      OMDB_API_KEY: ${OMDB_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local_onnx}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      ONNX_MODEL_PRESET: ${ONNX_MODEL_PRESET:-arctic-embed-xs}
      LLM_PROVIDER: ${LLM_PROVIDER:-off}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_IDLE_TIMEOUT_SECONDS: ${LLM_IDLE_TIMEOUT_SECONDS:-300}
      BRIDGE_MAX_DURATION_SECONDS: ${BRIDGE_MAX_DURATION_SECONDS:-45}
    volumes:
      - ./config:/config
